<div class="page">

  <header class="header">
    <h1>Bug Tracker</h1>
    <p class="subtitle">{{ tickets.length }} tickets</p>
  </header>

  <!-- Create form -->
  <section class="card">
    <h2>Create New Ticket</h2>
    <form class="ticket-form" (ngSubmit)="onCreateTicket()">
      <input class="field title-field" [(ngModel)]="newTicket.title" name="title" placeholder="Title" required />
      <input class="field" [(ngModel)]="newTicket.description" name="description" placeholder="Description" />

      <select class="field" [(ngModel)]="newTicket.status" name="status">
        <option value="TODO">To Do</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="RESOLVED">Resolved</option>
      </select>

      <select class="field" [(ngModel)]="newTicket.priority" name="priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>

      <button type="submit" class="btn btn-primary">Create Ticket</button>
    </form>
  </section>

  <!-- Ticket table -->
  <section class="card">
    <h2>All Tickets</h2>

    <p class="empty" *ngIf="tickets.length === 0">No tickets yet. Create one above.</p>

    <div class="table-wrap" *ngIf="tickets.length > 0">
      <table class="ticket-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ticket of tickets">
            <td class="title-cell">{{ ticket.title }}</td>
            <td class="desc-cell">{{ ticket.description }}</td>
            <td>
              <select class="pill status-{{ ticket.status }}" [(ngModel)]="ticket.status"
                      name="status-{{ ticket.id }}" (change)="onUpdateTicket(ticket)">
                <option value="TODO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
              </select>
            </td>
            <td>
              <select class="pill priority-{{ ticket.priority }}" [(ngModel)]="ticket.priority"
                      name="priority-{{ ticket.id }}" (change)="onUpdateTicket(ticket)">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </td>
            <td class="date-cell">{{ ticket.createdAt | date:'MMM d, h:mm a' }}</td>
            <td><button class="btn btn-delete" (click)="onDeleteTicket(ticket.id)">Delete</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>
